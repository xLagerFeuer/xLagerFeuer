name: Maintainer stats snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/maintainer-stats.yml"
      - "scripts/update_maintainer_stats.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update maintainer stats snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_maintainer_stats.py

      - name: Commit snapshot changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/history.json assets/maintainer-activity.svg
          if git diff --cached --quiet; then
            echo "No stats changes"
            exit 0
          fi
          git commit -m "chore: update maintainer activity snapshot"
          git push
