    <text x="870" y="34" text-anchor="end" font-size="10" fill="#6e7781" letter-spacing="0.8">PROFILE-WIDE GITHUB</text>

    <text x="30" y="86" font-size="42" font-weight="700">272</text>
    <text x="30" y="108" font-size="12" fill="#57606a">contributions/day · 10d avg</text>
    <text x="210" y="86" font-size="30" font-weight="700">377</text>
    <text x="210" y="108" font-size="12" fill="#57606a">peak / completed day</text>

    <g>
      <text x="30" y="132" font-size="9" font-weight="700" fill="#6e7781" letter-spacing="1.1">10D ACTIVITY</text>

      <text x="30" y="154" font-size="15"><tspan font-weight="700">692</tspan><tspan font-size="10" fill="#57606a"> PRs</tspan></text>
      <text x="165" y="154" font-size="15"><tspan font-weight="700">353</tspan><tspan font-size="10" fill="#57606a"> issues</tspan></text>

      <text x="30" y="179" font-size="15"><tspan font-weight="700">914</tspan><tspan font-size="10" fill="#57606a"> commits</tspan></text>
      <text x="165" y="179" font-size="15"><tspan font-weight="700">14</tspan><tspan font-size="10" fill="#57606a"> repos</tspan></text>
    </g>
  </g>

  <g id="layer-history" fill="#18181b" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace">
    <line x1="360" y1="115.2" x2="850" y2="115.2" stroke="#d8dee4" stroke-width="1" stroke-dasharray="4 5"/>
    <polyline points="360.0,100.3 409.0,90.1 458.0,84.7 507.0,123.7 556.0,98.9 605.0,145.4 654.0,156.0 703.0,152.8 752.0,123.7 801.0,78.0" fill="none" stroke="#18181b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
